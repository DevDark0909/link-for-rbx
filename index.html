<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DevCave Marketplace Ad Formatter</title>

<style>
  :root{
    --bg1: #0f1113;
    --bg2: #161718;
    --panel: #1f1f21;
    --muted: #9aa3ad;
    --accent1: #00c6ff;
    --accent2: #0072ff;
    --successA: #00c853;
    --successB: #00e676;
    --copyA: #0072ff;
    --copyB: #00c6ff;
  }

  html,body{height:100%;margin:0;background:linear-gradient(135deg,var(--bg1),var(--bg2));font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial;color:#fff;overflow-y:auto;}

  /* full-screen particle canvas behind content */
  #particle-canvas{
    position:fixed;
    inset:0;
    z-index:0; /* behind everything */
    pointer-events:none; /* don't block clicks */
    display:block;
  }

  .wrap{
    position:relative;
    z-index:5; /* above particles */
    max-width:980px;
    margin:36px auto;
    padding:28px;
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
    box-shadow:0 18px 50px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.03);
    backdrop-filter: blur(6px);
    min-height: 80vh;
  }

  /* BRANDING */
  .branding{
    display:flex;
    gap:18px;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
  }
  .logo-wrap{
    width:112px;
    height:112px;
    border-radius:16px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:center;
    animation: logoFloat 4s ease-in-out infinite;
  }
  .logo-wrap img{
    width:94%;
    height:94%;
    object-fit:cover;
    border-radius:12px;
    display:block;
    position:relative;
    z-index:3;
    background: #0b0b0b;
  }

  /* neon animated square border around logo (larger, blurred) */
  .logo-wrap::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:18px;
    background: linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent1));
    background-size:240% 240%;
    filter: blur(18px) saturate(120%);
    z-index:1;
    opacity:0.95;
    animation: logoGlow 6s linear infinite;
  }

  @keyframes logoGlow{
    0%{ background-position:0% 50%; transform: rotate(0deg) scale(1); }
    50%{ background-position:100% 50%; transform: rotate(1deg) scale(1.02); }
    100%{ background-position:0% 50%; transform: rotate(0deg) scale(1); }
  }

  @keyframes logoFloat {
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-9px); }
    100%{ transform: translateY(0px); }
  }

  .branding h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .branding .sub{font-size:13px;color:var(--muted);margin-top:6px;text-align:center;}

  /* responsive form layout */
  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-top:18px; }
  label{ display:block; margin-top:12px; font-weight:700; color:#e7eef8; font-size:13px; }
  input[type="text"], select, textarea{
    width:100%; padding:12px; border-radius:10px; border:none; background:#222; color:#fff; font-size:14px; outline:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
  }
  textarea{ min-height:140px; resize:vertical; }
  .full{ grid-column:1 / -1; }

  .controls{ display:flex; gap:12px; margin-top:18px; align-items:center; }
  .btn{ cursor:pointer; border:none; padding:12px 14px; border-radius:10px; font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:10px; }
  .btn.generate{ flex:1; background:linear-gradient(90deg,var(--successA),var(--successB)); color:#072410; box-shadow:0 8px 20px rgba(0,200,110,0.12); }
  .btn.copy{ background:linear-gradient(90deg,var(--copyA),var(--copyB)); color:white; }
  .btn:active{ transform: translateY(1px); }

  .error{ color:#ff6b6b; font-weight:700; margin-top:10px; min-height:22px; }

  .output{ width:100%; margin-top:14px; min-height:220px; padding:12px; border-radius:10px; border:none; background:#0e0e10; color:#ddd; resize:none; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace; font-size:13px; white-space:pre-wrap; }

  /* footer credit */
  .footer-credit{ margin-top:28px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.03); text-align:center; color:var(--muted); }
  .credit-line{ margin-bottom:6px; display:flex; gap:8px; align-items:center; justify-content:center; }
  .animated-name{ font-weight:900; font-size:16px; background: linear-gradient(90deg,#6ecbff,#3a8eff,#ffd54f,#ff9800); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation: nameShift 4s linear infinite, nameFloat 3.2s ease-in-out infinite; text-shadow: 0 6px 24px rgba(0,118,255,0.06); }
  @keyframes nameShift{ 0%{ background-position:0% 50% } 50%{ background-position:100% 50% } 100%{ background-position:0% 50% } }
  @keyframes nameFloat{ 0%{ transform: translateY(0px) } 50%{ transform: translateY(-8px) } 100%{ transform: translateY(0px) } }

  .version{ font-size:13px; color:#a6b0b8; margin-bottom:6px; }
  .copyright{ font-size:12px; color:#777; }

  @media (max-width:760px){
    .grid{ grid-template-columns:1fr; }
    .branding{ flex-direction:column; gap:8px; }
  }
</style>
</head>
<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div class="wrap" role="main">
  <div class="branding" role="banner">
    <div class="logo-wrap" title="DevCove Logo (animated GIF)">
      <!-- Replace logo.gif with your animated gif file -->
      <img src="logo.gif" alt="DevCove Logo">
    </div>

    <div>
      <h1>DevCove Marketplace</h1>
      <div class="sub">AD FORMATTER V2</div>
    </div>
  </div>

  <div class="grid">
    <div>
      <label for="adType">Ad Type</label>
      <select id="adType" aria-label="Ad Type">
        <option value="Hiring">Hiring</option>
        <option value="For Hire">For Hire</option>
        <option value="Selling">Selling</option>
      </select>
    </div>

    <div>
      <label for="ownerName">Post Owner Username (Required)</label>
      <input id="ownerName" type="text" placeholder="@Username">
    </div>

    <div>
      <label for="ownerId">Post Owner ID (Required)</label>
      <input id="ownerId" type="text" inputmode="numeric" placeholder="123456789012345678">
    </div>

    <div class="full">
      <label for="adContent">Ad Content</label>
      <textarea id="adContent" placeholder="Write your ad here..."></textarea>
    </div>
  </div>

  <div class="controls" role="toolbar">
    <button class="btn generate" id="generateBtn">Generate Formatted Ad</button>
    <button class="btn copy" id="copyBtn">💎 Copy To Clipboard</button>
  </div>

  <div class="error" id="errorBox" role="status" aria-live="polite"></div>

  <label style="margin-top:14px;display:block;font-weight:700;color:#e7eef8;margin-bottom:6px">Formatted Discord Ad</label>
  <textarea id="output" class="output" readonly aria-label="Formatted Ad Output"></textarea>

  <div class="footer-credit" role="contentinfo">
    <div class="credit-line">
      Made by <span class="animated-name">@___devdark__</span> for <strong style="color:var(--accent1);">DevCove</strong>
    </div>
    <div class="version">Version 2.1.0</div>
    <div class="copyright">© 2025 DevCove. All rights reserved.</div>
  </div>
</div>

<script>
/* ---------------------------
   Particle background (Canvas)
   --------------------------- */
(function(){
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;
  let particles = [];
  let particleCount = Math.floor(Math.min(100, Math.max(30, (W*H)/90000))); // scale count by screen size
  // colors pulled from accent gradient
  const colors = [
    {r: 0, g:198, b:255, a:0.10},
    {r: 0, g:114, b:255, a:0.08},
    {r: 255, g:213, b:79, a:0.06}
  ];

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function createParticle(i){
    const size = rand(0.9, 3.2);
    const p = {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: rand(-0.25, 0.25),
      vy: rand(-0.3, -0.05), // slight upward drift
      size: size,
      baseSize: size,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: rand(80, 220) + Math.random()*200,
      phase: Math.random()*Math.PI*2
    };
    particles[i] = p;
  }

  function init(){
    particles = [];
    for(let i=0;i<particleCount;i++) createParticle(i);
  }

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    // recalc count lightly on resize
    particleCount = Math.floor(Math.min(120, Math.max(20, (W*H)/90000)));
    init();
  }

  window.addEventListener('resize', resize);

  function draw(){
    ctx.clearRect(0,0,W,H);

    for(let i=0;i<particles.length;i++){
      const p = particles[i];
      // gentle sinusoidal size change for twinkle
      p.phase += 0.01 + Math.random()*0.01;
      const twinkle = 0.9 + 0.2 * Math.sin(p.phase*1.5);
      const r = p.size * twinkle;

      // draw radial glow
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(r*3, 8));
      const c = p.color;
      grad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${c.a})`);
      grad.addColorStop(0.6, `rgba(${c.r},${c.g},${c.b},${c.a*0.25})`);
      grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
      ctx.beginPath();
      ctx.fillStyle = grad;
      ctx.arc(p.x, p.y, Math.max(r*2, 4), 0, Math.PI*2);
      ctx.fill();

      // move
      p.x += p.vx + Math.sin(p.phase)*0.05;
      p.y += p.vy;

      // gentle horizontal wrap and vertical wrap from bottom to top
      if(p.x < -20) p.x = W + 20;
      if(p.x > W + 20) p.x = -20;
      if(p.y < -30) p.y = H + 20;
      if(p.y > H + 40) p.y = -40;
    }

    requestAnimationFrame(draw);
  }

  // pause animation when tab not visible to save CPU
  let running = true;
  document.addEventListener('visibilitychange', function(){
    running = !document.hidden;
    if(running) requestAnimationFrame(draw);
  });

  init();
  requestAnimationFrame(draw);
})();

/* ---------------------------
   Main UI logic (generate/copy)
   --------------------------- */
(function(){
  const adTypeEl = document.getElementById("adType");
  const ownerNameEl = document.getElementById("ownerName");
  const ownerIdEl = document.getElementById("ownerId");
  const adContentEl = document.getElementById("adContent");
  const errorBox = document.getElementById("errorBox");
  const outputEl = document.getElementById("output");
  const generateBtn = document.getElementById("generateBtn");
  const copyBtn = document.getElementById("copyBtn");

  function getPing(type){
    if(type === "Hiring") return "@For-hire ping";
    if(type === "For Hire") return "@Hiring ping";
    if(type === "Selling") return "@Selling ping";
    return "";
  }

  function validate(ownerName, ownerId, content){
    if(!ownerName || !ownerId){
      return "Post Owner Username and Owner ID are MANDATORY.";
    }
    if(!/^\d+$/.test(ownerId)){
      return "Owner ID must contain numbers only.";
    }
    if(!content){
      return "Ad Content cannot be empty.";
    }
    return "";
  }

  function buildFormatted(ownerName, ownerId, content, type){
    const ping = getPing(type);
    return `**⚠️ PLEASE MESSAGE THE POST OWNER, STAFF WILL NOT RESPOND ⚠️**

${content}

**AD OWNER:** ${ownerName} (<@${ownerId}>)

**⚠️ PLEASE MESSAGE THE POST OWNER, STAFF WILL NOT RESPOND ⚠️**
**---------------------------------------------------------- **

${ping}`;
  }

  generateBtn.addEventListener("click", function(){
    errorBox.textContent = "";
    const ownerName = ownerNameEl.value.trim();
    const ownerId = ownerIdEl.value.trim();
    const content = adContentEl.value.trim();
    const type = adTypeEl.value;

    const err = validate(ownerName, ownerId, content);
    if(err){
      errorBox.textContent = err;
      outputEl.value = "";
      return;
    }

    outputEl.value = buildFormatted(ownerName, ownerId, content, type);
    outputEl.focus();
    outputEl.select();
  });

  copyBtn.addEventListener("click", async function(){
    const text = outputEl.value.trim();
    if(!text){
      errorBox.textContent = "Generate the ad first before copying.";
      return;
    }
    try{
      await navigator.clipboard.writeText(text);
      copyBtn.textContent = "✅ Copied";
      setTimeout(()=> { copyBtn.innerHTML = "💎 Copy To Clipboard"; }, 1400);
    }catch(e){
      // fallback
      outputEl.select();
      try{
        document.execCommand('copy');
        copyBtn.textContent = "✅ Copied";
        setTimeout(()=> { copyBtn.innerHTML = "💎 Copy To Clipboard"; }, 1400);
      }catch(err){
        alert("Could not copy automatically. Please select and copy manually.");
      }
    }
  });

})();
</script>
</body>

</html>
